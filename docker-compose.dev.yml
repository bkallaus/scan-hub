# Local run on Docker Desktop (Mac/Windows), where host networking isn't
# available. Simulated scanner by default:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# Real scanner (outgoing connections to a fixed IP work without host networking;
# the automatic network search doesn't):
#   SIMULATE_SCANNER=0 SCANNER_IP=192.168.x.y docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  scanhub:
    network_mode: !reset bridge
    ports:
      - "8680:8680"
    environment:
      SIMULATE_SCANNER: "${SIMULATE_SCANNER:-1}"
      SCANNER_IP: "${SCANNER_IP:-}"
    volumes: !override
      - ./data-dev:/data
